name: build

# Freeze the HCS viewer into openable desktop artifacts (Linux AppImage + Windows + macOS),
# mirroring maragall/ndviewer_light and maragall/stitcher. The `smoke` job is the dependency-import
# check requested — it fails CI if the runtime deps don't import cleanly on any OS.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  # ---- dependency-import smoke + tests (the two OSes that gate the artifacts) ------------------
  #
  # WINDOWS WAS SPLIT OUT OF THIS MATRIX on 2026-08-05, into `smoke-windows` below. Read that job's
  # comment before assuming this is a convenience: it is a deliberate, narrow, TEMPORARY decoupling
  # of one platform's KNOWN defect from the other two platforms' artifacts, and it is not a way of
  # making a red test green.
  #
  # `freeze` has `needs: smoke`, and a `needs:` waits on the WHOLE matrix job -- GitHub has no
  # per-leg dependency. So while Windows was a leg of this matrix, one Windows failure skipped the
  # freeze job for macOS and Linux too. That is why this workflow has never produced an artifact on
  # ANY platform (run 31056664194: all three smoke legs `failure`, `freeze` `skipped`).
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Qt6 links libEGL even under QT_QPA_PLATFORM=offscreen, and the ubuntu runner image does not
      # ship it: `import qtpy.QtWidgets` died with "libEGL.so.1: cannot open shared object file".
      # That is a MISSING SYSTEM LIBRARY, not a Python problem, so no amount of pip solves it.
      # libgl1 and libxkbcommon-x11-0 are the other two the Qt platform plugins dlopen; installing
      # only libegl1 moves the same error one library down the list.
      - name: System Qt libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      # ndviewer_light was REMOVED from this install on 2026-07-31. It was deleted as a dependency
      # on 2026-07-30 (ce5605c) precisely because it imports PyQt5 at module scope, and the app now
      # pins QT_API=pyqt6 -- so this line was reinstalling PyQt5 into the environment the whole Qt6
      # migration exists to keep PyQt5 out of. Two Qt majors in one process is the ONE-BINDING RULE,
      # and here CI itself was the thing breaking it.
      - name: Install (with GUI extra)
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui,test]"
      - name: Dependency-import smoke (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_import.py
      # CHUNKED, not a bare `pytest`, as of 2026-08-05. This step had failed on ALL THREE OSes on
      # every push, and `freeze` has `needs: smoke`, so NO BUILD ARTIFACT HAS EVER BEEN PRODUCED
      # by this workflow -- verified on run 31056664194, where all three smoke legs are `failure`
      # and `freeze` is `skipped`. macOS and ubuntu both died the same way:
      #
      #     Fatal Python error: Aborted        (exit 134)
      #
      # That is not a test failure. It is the GUI-test resource-accumulation crash that
      # tools/run_suite_chunked.py exists for: finished QThread workers pile up and around ~150
      # GUI tests' worth exhausts the process. CI ran ~2500 tests in ONE process, which is far
      # past the measured cliff, so the abort was guaranteed. `gc.disable()` in conftest (31798d9)
      # reduces the pressure but cannot survive a single process that large.
      #
      # The runner puts each ~100-test chunk in its own process and -- the part that matters for a
      # gate -- distinguishes a chunk that CRASHED MID-RUN (tests never executed; INCOMPLETE, hard
      # fail) from one that finished every test and then crashed in Qt teardown (benign, reported).
      # Its exit code is already correct for CI use: `return 0 if (total_f == 0 and not incomplete)
      # else 1` (tools/run_suite_chunked.py:223), so a crashed-mid-run chunk cannot exit 0. It was
      # read and confirmed rather than assumed, because a CI step that always exits 0 is worse
      # than no CI step.
      #
      # Local baseline on macOS with this exact invocation: 2509 passed, 0 failed, 36 skipped,
      # SUITE INCOMPLETE: none.
      #
      # QT_QPA_PLATFORM and PYTEST_DISABLE_PLUGIN_AUTOLOAD are set by the runner itself for every
      # chunk (_base_env), and are kept here so the environment is visible at the call site.
      - name: Tests (headless, chunked)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python tools/run_suite_chunked.py

  # ---- Windows: runs, reports, does NOT gate the artifacts -------------------------------------
  #
  # WHY THIS IS A SEPARATE JOB AND NOT A MATRIX LEG. Windows fails this suite for a reason that is
  # documented, reproducible only on Windows, and NOT fixed here:
  #
  #   an access violation in squidmip/_montage.py:302 `_composite_band`
  #   (`gray[ch] = table[plane.reshape(-1)]`), reached from :262 inside concurrent.futures
  #   worker threads.
  #
  # The AI-docs NOTES entry for it records that the "LUT bounds check" hypothesis looks like a red
  # herring -- the LUT is sized to the full domain and numpy fancy-indexing bounds-checks anyway --
  # and that the likelier cause is `store` being memory-mapped by `_platecache` and read
  # concurrently by the band pool, since POSIX allows unlinking a mapped file and Windows does not.
  # It ends: "Needs Windows to reproduce; do not 'fix' it from a Mac on hypothesis (b) alone."
  # That instruction is respected here. Nothing in the product was changed for Windows.
  #
  # So this job exists to keep the failure VISIBLE (it goes red, on every push, with the real logs)
  # while not holding the macOS and Linux artifacts hostage to it. It is NOT `continue-on-error`
  # and it is NOT excluded: a red X on `smoke-windows` is the honest state of Windows today.
  #
  # DELETE THIS JOB and put windows-latest back in the `smoke` matrix the moment the montage crash
  # is fixed on a real Windows machine. Until then, treat the Windows artifact from `freeze` as
  # UNVALIDATED -- it builds, and no test has confirmed it runs.
  smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with GUI extra)
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui,test]"
      - name: Dependency-import smoke (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_import.py
      - name: Tests (headless, chunked)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python tools/run_suite_chunked.py

  # ---- freeze the GUI per OS via PyInstaller ---------------------------------------------------
  freeze:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same missing system libraries as the smoke job: PyInstaller IMPORTS the app to analyse it,
      # so a Linux freeze hits libEGL exactly where the import gate did.
      - name: System Qt libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      # ndviewer_light removed here too, 2026-07-31, and it matters MORE in this job than in smoke:
      # a frozen bundle built with PyQt5 present ships both bindings, and `hcs-viewer.spec` now
      # excludes PyQt5 by name -- so the install and the spec were arguing with each other inside
      # the one artifact a biologist double-clicks.
      - name: Install (+ PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" pyinstaller
      # IMA-232: the spec file, not a flag soup. The old one-liner passed --windowed AND
      # -c; -c wins, so on macOS it built a console executable and never produced a .app
      # at all. The spec also carries the ml_dtypes hidden import (without it the bundle
      # dies on first run) and the excludes that took the macOS bundle 517 -> 352 MB.
      - name: Freeze hcs-viewer
        run: pyinstaller --noconfirm --clean scripts/hcs-viewer.spec
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          # AppImage packaging of dist/hcs-viewer (linuxdeploy). Best-effort; validated on the first CI run.
          echo "AppImage packaging step — wire linuxdeploy here (see maragall/ndviewer_light CI)."
      - uses: actions/upload-artifact@v4
        with:
          name: hcs-viewer-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn
