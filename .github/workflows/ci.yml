name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 REMOVED 2026-08-05. It was not a policy choice, it never worked: the `test (3.10)`
        # leg failed at INSTALL with "No matching distribution found for zarr>=3.0", because every
        # zarr 3.x wheel declares Requires-Python >=3.11 and `zarr>=3.0` is a hard dependency.
        # pyproject's `requires-python` now says ">=3.11" to match, so this matrix and that
        # declaration agree instead of one of them being aspirational.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Qt6 links libEGL even under QT_QPA_PLATFORM=offscreen and the ubuntu runner image does not
      # ship it. Same three libraries as build.yml's jobs, for the same reason: this is a MISSING
      # SYSTEM LIBRARY, and no amount of pip solves it.
      - name: System Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      # `.[gui,test]`, not `.[test]`, as of 2026-08-05. The old line installed the headless extra
      # only, and then ran the WHOLE suite against it -- so the 3.11 and 3.12 legs died in
      # COLLECTION with 8 errors, all of them:
      #     ModuleNotFoundError: No module named 'qtpy'
      # from tests/test_gui_commands.py, test_layer_tree.py, test_logpanel.py, test_op_panels.py
      # and friends, which import qtpy at module scope. The comment that stood here called this a
      # "clean-room install ... proves the build is reproducible off the dev machine", and that
      # intent is real, but it was being proved against a test suite that is 40% GUI. A clean-room
      # install of the CLI is still proved -- by `pip install .` resolving the base dependency set
      # in this same step -- while the suite now gets the extra it actually needs.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui,test]"
      # CHUNKED, for the same measured reason as build.yml: ~2500 tests in one process exhausts it
      # on the accumulated Qt worker objects and the process aborts (exit 134) with no test having
      # failed. tools/run_suite_chunked.py runs ~100 tests per process and exits non-zero on any
      # failure OR any chunk that died mid-run, so a crash cannot be mistaken for a pass.
      #
      # `-m "not integration"` is gone: it was here because the integration tests need the real
      # hongquan dataset, and they still do -- but they are marked `integration` and their fixtures
      # skip themselves when the data is absent, which is what the 26 deselected / 32 skipped in
      # the old logs already showed. The chunked runner collects the whole suite by design.
      - name: Test (chunked)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/run_suite_chunked.py

  # THE FUNCTIONAL HARNESSES, WHICH NOTHING RAN UNTIL NOW.
  #
  # `tools/walkthrough.py`, `tools/acceptance.py` and `tools/gates.py` exist because "every defect
  # this project shipped passed a green unit suite" (walkthrough's own docstring). All three were
  # themselves dead on 2026-08-06: acceptance and gates still built a PyQt5 QApplication around
  # Qt6 widgets and aborted before their first check, walkthrough's datasets had moved, and nobody
  # noticed for weeks because no job ran them. A harness nothing runs is a comment.
  #
  # WHAT THIS RUNNER CAN AND CANNOT DO, stated rather than papered over:
  #   * IT CAN run most of them. The plate fixture is GENERATED by `tools/make_5d_fixture.py`
  #     (0.1 s, 2.5 MB at this size), so this job builds one and hands the path over in
  #     SQUIDMIP_FIXTURE_PLATE. Measured on a dataset-free machine: walkthrough 20 passed /
  #     5 skipped, acceptance all cases + all six Squid writers, gates --self-test green.
  #   * IT CANNOT run the checks that need the two REAL acquisitions (the 10x tissue z-stack and
  #     the 1536-well plate). Those live on one workstation and nothing synthesises them. They
  #     SKIP, by name, with the absent path printed -- a skip is not a pass and the summary line
  #     counts them separately.
  #   * IT CANNOT run `tools/verify_napari_mosaic.py` at all: napari needs a real GL context and
  #     this runner is offscreen. It is deliberately NOT in this job. Adding it would produce a
  #     step that passes without executing its body, which is the exact failure being fixed here.
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System Qt libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui,test]"
      # 4 wells x 9 FOVs on a 9 mm (96-well) pitch, DECLARED as a 384 -- so the plate-shape check
      # has a real contradiction to resolve, and every well has more than one field to mosaic.
      - name: Build the plate fixture
        run: |
          python tools/make_5d_fixture.py "$RUNNER_TEMP/sim_plate" \
            --fovs 9 --nz 1 --nt 1 --size 128 \
            --well-pitch-mm 9.0 --declared-format "384 well plate"
      - name: Acceptance (does an acquisition open at all)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export SQUIDMIP_FIXTURE_PLATE="$RUNNER_TEMP/sim_plate"
          python tools/acceptance.py
      - name: Walkthrough (does each feature do its job)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export SQUIDMIP_FIXTURE_PLATE="$RUNNER_TEMP/sim_plate"
          python tools/walkthrough.py
      # --self-test, not the bare gate: the gate's whole claim is that it can FAIL, and it spent
      # two weeks unable to (its mutation patched a _ChannelBar the window stopped building on
      # 2026-07-22). The self-test runs the gate clean, then twice with a duplicate control
      # mounted, and requires a red each time. It subsumes the plain run.
      - name: GUI gates, mutation-checked
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export SQUIDMIP_FIXTURE_PLATE="$RUNNER_TEMP/sim_plate"
          python tools/gates.py --self-test
