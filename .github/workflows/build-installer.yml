name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: squidxplorer-windows-installer
          - os: macos-latest # arm64 (Apple Silicon)
            artifact: squidxplorer-macos-arm64-installer
          # ubuntu-22.04, not -latest: PyInstaller links the build machine's glibc, and a
          # binary frozen on 22.04 (glibc 2.35) runs on every later distro; one frozen on
          # 24.04 refuses to start on 22.04, which real lab machines still run.
          - os: ubuntu-22.04
            artifact: squidxplorer-linux-x86_64-installer
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the squidxplorer wheel
        run: uv build --wheel --out-dir dist

      # The payload rides INSIDE the frozen binary (bootstrap reads it back from
      # sys._MEIPASS/payload), so each platform's installer is ONE file.
      - name: Stage the payload (wheel + uv)
        shell: bash
        run: |
          mkdir payload
          cp dist/squidxplorer-*.whl payload/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$(command -v uv)" payload/uv.exe
          else
            cp "$(command -v uv)" payload/uv
          fi

      - name: Freeze the one-file bootstrapper
        shell: bash
        run: |
          sep=":"; [ "$RUNNER_OS" = "Windows" ] && sep=";"
          # --icon only on Windows: it is the wellplate art the .exe shows in Explorer, and the
          # SAME .ico rides in the payload so the finished install's desktop shortcut carries it
          # (bootstrap._windows_shortcut). macOS gets its icon from the .app bundle; the AppImage
          # from the .png below — one drawing (scripts/installer/make-icon.py), three encodings.
          icon=""
          [ "$RUNNER_OS" = "Windows" ] && icon="--icon scripts/installer/squidxplorer.ico"
          cp scripts/installer/squidxplorer.ico scripts/installer/squidxplorer.png payload/
          uvx pyinstaller --onefile --console --name SquidXplorer-Setup $icon \
            --add-data "payload${sep}payload" scripts/installer/bootstrap.py

      # No --source: the binary must find its own embedded wheel and uv.
      - name: Smoke test (dry-run prints the uv commands)
        shell: bash
        run: dist/SquidXplorer-Setup* --env envtest --extras stitch --dry-run

      # Not just a dry-run: the frozen binary performs a real install into a scratch env, and
      # the env's own interpreter must import the result. This is the step that catches a
      # bootstrapper that prints the right commands and installs nothing.
      #
      # gui,stitch — THE CUSTOMER DEFAULT (decon is CUDA-gated and no runner has CUDA), not
      # core-only. Measured blind spot, 2026-08-16: a core-only install here shipped green while
      # containing no Qt at all — `squidxplorer-view` died on `import qtpy` the moment a real
      # machine launched it. The packs a double-click installs are the packs this must install.
      - name: Real install (customer default packs) and import check
        shell: bash
        run: |
          dist/SquidXplorer-Setup* --env envtest --extras gui,stitch
          if [ "$RUNNER_OS" = "Windows" ]; then py=envtest/Scripts/python.exe; else py=envtest/bin/python; fi
          "$py" -c "import squidxplorer; print('import ok:', len(squidxplorer.runnable_operators()), 'operators registered')"
          "$py" -c "import qtpy; import tilefusion; print('gui + stitch packs import ok')"

      # Registered is not runnable: `requires=` refuses by name when a package is missing, so a
      # green import proves nothing about the pixels. Run two REAL operators through the
      # installed env over a synthetic acquisition — mip (core) and stitch (the tilefusion pack,
      # pinned to a SHA whose install this is the only per-platform proof of). The CLI returns a
      # nonzero exit code on a failed or partial run, and the written plate is checked on disk.
      - name: Run real operators through the installed env (mip + stitch)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            py=envtest/Scripts/python.exe; cli=envtest/Scripts/squidxplorer.exe
          else
            py=envtest/bin/python; cli=envtest/bin/squidxplorer
          fi
          "$py" tools/make_5d_fixture.py fixture --regions A1,A2 --fovs 4 --nz 3 --nt 1 --size 128
          "$cli" fixture --operator mip --output-folder out-mip
          "$cli" fixture --operator stitch --output-folder out-stitch
          "$py" -c "
          from pathlib import Path
          for out in ('out-mip', 'out-stitch'):
              store = Path(out) / 'fixture.hcs' / 'plate.ome.zarr'
              assert store.is_dir(), f'{store} was not written'
              marker = store / '.squidxplorer-incomplete'
              assert not marker.exists(), f'{out}: the store says it is incomplete'
          print('mip + stitch wrote complete plates')
          "

      - name: Package as AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          ARCH: x86_64
        run: |
          mkdir -p AppDir
          cp dist/SquidXplorer-Setup AppDir/
          cp scripts/installer/squidxplorer.png AppDir/
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/SquidXplorer-Setup" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/SquidXplorer-Setup
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=SquidXplorer Setup' \
            'Exec=SquidXplorer-Setup' 'Icon=squidxplorer' 'Terminal=true' 'Categories=Science;' \
            > AppDir/squidxplorer-setup.desktop
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir SquidXplorer-Setup-x86_64.AppImage

      - name: Smoke test the AppImage (dry-run)
        if: runner.os == 'Linux'
        run: ./SquidXplorer-Setup-x86_64.AppImage --appimage-extract-and-run --env envtest2 --extras "" --dry-run

      - name: Stage artifact (Windows — the exe alone)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory staged | Out-Null
          Copy-Item dist\SquidXplorer-Setup.exe staged\

      # Info-ZIP stores the unix mode, so extracting this inner zip (Archive Utility
      # double-click included) restores the executable bit that GitHub's own artifact
      # zip would drop from a bare binary.
      - name: Stage artifact (macOS — one executable, permission-preserving zip)
        if: runner.os == 'macOS'
        run: |
          mkdir staged
          (cd dist && zip -X ../staged/SquidXplorer-Setup.zip SquidXplorer-Setup)

      - name: Stage artifact (Linux — the AppImage alone)
        if: runner.os == 'Linux'
        run: |
          mkdir staged
          mv SquidXplorer-Setup-x86_64.AppImage staged/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staged/
