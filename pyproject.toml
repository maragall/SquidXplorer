[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squidxplorer"
version = "0.3.0"
description = "High-throughput z-stack maximum-intensity projection for Squid well-plate acquisitions"
readme = "README.md"
# ">=3.11", not ">=3.10", as of 2026-08-05. This was a FALSE claim and CI proved it: the `test
# (3.10)` leg of .github/workflows/ci.yml failed at INSTALL, not at test time, with
#     ERROR: Could not find a version that satisfies the requirement zarr>=3.0 (from squidxplorer)
#     ERROR: No matching distribution found for zarr>=3.0
# because every zarr 3.x release declares Requires-Python >=3.11. `zarr>=3.0` is a hard runtime
# dependency below, so this package has been uninstallable on 3.10 since that pin landed while
# still advertising 3.10 support. The metadata now matches what actually resolves.
requires-python = ">=3.11"
# SPDX string form + license-files, matching the stitcher (tilefusion) pyproject.toml:10 rather
# than the deprecated `{ text = ... }` table. The change that matters is `license-files`: this
# metadata claimed BSD-3-Clause from the first commit while the repo had NO LICENSE FILE AT ALL,
# so the claim was unbacked and every wheel and every .app shipped without the terms it names.
# LICENSE is now the stitcher's file verbatim (year bumped to 2026), and naming it here is what
# makes `pip install` and the frozen bundle actually carry it.
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Cephla" }]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.1.0",
    "imagecodecs",              # tifffile needs this to decode LZW/compressed Squid TIFFs (real data)
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tensorstore>=0.1.45",
    "zarr>=3.0",                # IMA-231: writes the AnnData-encoded FOV_ROI_table (vlen-utf8
    #                             string arrays in zarr v3), which tensorstore cannot encode.
    #                             anndata itself is NOT a dependency — the encoding is a documented
    #                             on-disk contract and the table is nine columns wide.
    "pillow>=10.0",
    "platformdirs>=3.0",        # Gap 1: the persistent plate-cell cache (squidxplorer/_platecache.py)
    #                             needs the per-OS user cache directory. It is a hard dependency
    #                             and not a lazy import, because the alternative to knowing where
    #                             the cache belongs is writing beside the acquisition, and this
    #                             tool promises it never writes into your data folder.
    "pydantic-settings>=2.3",   # declarative CLI (IMA-186), same pattern as the stitcher
    "scipy>=1.10",              # ndimage gaussian_filter and zoom (resampling); imported lazily
    #                             so the reader/writer path still starts without touching it.
    # scikit-image was dropped 2026-08-24 with the shelved bgsub operator (its one stated
    # consumer, restoration.rolling_ball). napari declares scikit-image itself, so the frozen
    # build's collect_all("skimage") in scripts/hcs-viewer.spec still resolves — measured.
]

# CORRECTED 2026-08-05. The line that stood here said "No tilefusion dependency" and that was
# FALSE, measured: `squidxplorer/_stitch.py` imports `tilefusion.{registration,optimization,fusion,
# flatfield,distortion,utils}` at 7 call sites and `squidxplorer/_flatfield.py` at 3 more. The claim
# was true of IMA-189 ingest and was never revised when stitching landed on top of it.
#
# What IS still true, and is the reason the false line was believable: the OME-zarr WRITER is
# vendored (squidxplorer/_zarr_store.py), not imported, because importing tilefusion runs its heavy
# __init__ (numba's threading-layer pin, GPU/cupy probes, basicpy). That vendoring is why the
# reader/writer path installs without tilefusion. The STITCH path does not, and never did.
#
# So tilefusion is a real dependency of a real feature, and it now lives in the `stitch` extra
# below rather than being denied here.

[project.optional-dependencies]
# video: the .mp4 movie export (squidxplorer/_video.py). imageio drives imageio-ffmpeg, whose wheel
# carries its OWN ffmpeg binary for Linux, Windows and macOS — so this works on a laptop with no
# system ffmpeg on PATH, which is the portability property the feature needs and the reason no
# other backend was chosen (PyAV needs a compiler or a platform wheel; OpenCV is 110 MB and was
# deliberately excluded from the frozen app).
#
# ITS OWN EXTRA, not folded into [gui]: the frame producer is Qt-free and headless-testable, and a
# CI job or a script that wants a movie should not have to install napari and PyQt6 to get one.
# [gui] and [test] both pull it in below, so the desktop app and the suite always have it.
#
# BOTH ARE ALREADY IN THE FROZEN APP'S COLLECT LIST (scripts/hcs-viewer.spec). They used to be in
# its EXCLUDES — "48 MB (a bundled ffmpeg); skimage.io only" — which was correct while nothing in
# this package encoded anything and is now the difference between shipping the feature and
# shipping a permanently disabled button.
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4.9"]
# ome-zarr-models: official OME-NGFF v0.5 pydantic schema — validates written plate metadata
# in tests (test-time only; the runtime writer stays lean, no extra runtime dep).
#
# pytest-timeout is NOT optional here even though nothing imports it: `tools/run_suite_chunked.py`
# -- the runner BOTH CI workflows invoke -- passes `-p pytest_timeout` explicitly, so without it
# pytest dies during pre-parse with `ImportError: Error importing plugin "pytest_timeout"` and
# collects ZERO tests. Measured 2026-08-05 in a clean venv built from this file: `pip install
# ".[gui,test]"` then the runner, which is exactly CI's two lines, ended at
# "SUITE COLLECTION FAILED: zero tests collected". The suite was green on this laptop the whole
# time because the dev environment had the plugin from somewhere else, so nothing here could see it.
test = ["pytest>=7.0", "pytest-timeout>=2.1", "ome-zarr-models>=1.7", "squidxplorer[video]"]
# gui: the MIP tool desktop app. Qt (via qtpy) + napari. ndviewer_light was removed on
# 2026-07-30: napari is the renderer and the second stack imported PyQt5 at module scope,
# which cannot share a process with a Qt6 napari.
# The headless pipeline (reader/projection/engine/output) never imports these, so the CLI installs
# without them.
#
# napari is the PRIMARY viewer, not an optional nicety: _napari_pane, _napari3d and _napari_view
# import it, and every mosaic/window renders through it. It was undeclared here and absent from
# CI's install lines, so a clean `.[gui]` install produced an app whose every view window showed
# "napari viewer unavailable (NapariBindingError)" while the plate shell looked fine -- a failure
# that reads as a platform bug and is not one. Verified against napari 0.8.0 on Windows via
# squidxplorer._napari_view.verify_napari_bindings(), which is the guard that was firing.
#
# psutil is what _rss_mb() and _region_viewer's memory bar actually want. Without it they fall
# back to `resource`, which does not exist on Windows, so the footprint readout sat at 0 MB
# forever -- the memory warning the README promises could never fire on Windows.
# The napari range matches the one Cephla validated in the Squid HCS GUI
# (jsschwrz/Squid 757d571, "Migrate GUI from PyQt5 to PyQt6 for napari 0.7 / Python 3.14"),
# so the two apps that embed napari do not drift onto different majors.
#
# napari >=0.7 targets Qt6, and that commit found napari 0.7 + vispy 0.16 under PyQt5 renders the
# mosaic glitchily. That caveat is now DISCHARGED rather than tracked: the binding below is Qt6.
gui = [
    # PyQt6, not PyQt5, as of 2026-07-31. The code migration landed weeks ago (10b8348, f7f9b28,
    # ce5605c) but this line still asked for Qt5, so every fresh `.[gui]` install produced a
    # PyQt5-only environment and qtpy -- whose preference order starts at PyQt5 -- ran the
    # "migrated" app on Qt5. The declaration and `squidxplorer/__init__.py`'s pin have to agree or
    # one of them is a lie; they now do.
    #
    # Qt6 is not cosmetic here. It scales fractional-DPI displays correctly by default, which is
    # the "everything renders at about 3x2 inches" report from the 4K Windows demo machine, and
    # it is a precondition for ever embedding a Qt 6.9 renderer in-process.
    #
    # NOT PINNED UPWARD: verified against PyQt6 6.11 only. If a future major breaks, name it here.
    "PyQt6>=6.5",
    # Ceiling lifted from <0.8 to <0.9 on 2026-07-30 (Qt6 step 3). The <0.8 pin was a
    # QT-BINDING HEDGE, not a known 0.8 defect, and the binding is no longer named in the code
    # (everything goes through qtpy, and the suite is green under QT_API=pyqt6).
    #
    # UNVERIFIED, said plainly: napari 0.8 is not installed on the machine that made this change,
    # so nothing here proves 0.8 works. This removes a hedge that no longer has a reason; it does
    # not certify the newer version. Whoever first installs 0.8 should run the suite before
    # trusting it.
    # The VERIFIED pair: the suite and every hand check run napari 0.6.6 + vispy 0.15.2. The
    # 0.8 line died natively after open on a customer Windows machine (2026-08-18); raise this
    # only with a full suite AND a Windows hand check on the new line.
    "napari>=0.6.5,<0.7",
    "vispy>=0.15.2,<0.16",
    # vispy's C fast path. Without it every launch logs "No OpenGL_accelerate module loaded" and
    # texture uploads run in pure Python — present in the Windows rig's 80 s first-paint log
    # (2026-08-18). A compiled wheel; the CI wheels-only guard proves it ships as one.
    "pyopengl-accelerate>=3.1.7",
    "psutil>=5.9",
    # The movie export is a window feature, so the desktop app always has its encoder. Declared
    # by reference rather than duplicated: two copies of a version range drift.
    "squidxplorer[video]",
]

# ---------------------------------------------------------------------------------------------
# OPERATOR EXTRAS (added 2026-08-05). One extra per operator family, named for the operator, not
# for the package, because the operator is what a user asks for.
#
# Until today these three packages were imported by shipped code and declared NOWHERE, so
# `pip install .[gui]` produced an app whose stitch, decon and segment operators could not run.
# `requires=` (see CLAUDE.md) made that failure honest -- the operator is LISTED and REFUSES BY
# NAME instead of silently producing nothing -- but a named refusal is a safety net, not a fix.
# These extras are the fix: they make the working install expressible.
#
# NOT ON PyPI, and this is the important caveat. `tilefusion` is maragall/stitcher and `petakit`
# is maragall/deconvolution; both are public GitHub repos with no PyPI release, so they can only
# be named as PEP 508 direct references. Consequences, stated rather than discovered:
#   * `[tool.hatch.metadata] allow-direct-references` has to be back on (see below).
#   * a wheel built from this project cannot be uploaded to PyPI. It is not published there, so
#     nothing is lost, but do not be surprised by the twine error if that ever changes.
#   * `pip install .[stitch]` needs network access to github.com. ARCHIVE TARBALLS, not
#     `git+https` (changed 2026-08-16): a git+ reference makes pip/uv shell out to a `git`
#     binary, which every CI runner has and a customer's lab machine may not — the frozen
#     installer must work on a machine with NOTHING preinstalled. GitHub serves the identical
#     SHA-pinned tree as a tarball, so the pin is unchanged and git is out of the contract.
#
# PINNED TO SHAs (2026-08-13, installer milestone): an installer that resolves whatever the
# default branch holds that day cannot promise two users the same install. squidxplorer calls
# tilefusion private helpers (`_edges_from_pairwise_metrics`, `_check_connectivity`), which is a
# tighter coupling than a version range can express anyway. Bump the SHA deliberately, with the
# suite green against it.
stitch = [
    # squidxplorer/_stitch.py (7 import sites) + squidxplorer/_flatfield.py (3). Registration,
    # optimization, fusion, distortion and BaSiC flat-fielding are all tilefusion's, called in
    # TileFusion.run()'s own order on in-memory arrays.
    "tilefusion @ https://github.com/maragall/stitcher/archive/28d9cfc66482c9e5931768bf15707e011bf47dbc.tar.gz",
]
decon = [
    # squidxplorer/_decon.py -> `import petakit` (PetaKit5D's Richardson-Lucy port). Declared on the
    # registry as `requires=("petakit",)` for the `decon` operator (the volume solve).
    # psfmodels is deliberately NOT listed here: squidxplorer never imports it, petakit does. It is
    # petakit's dependency to declare, and adding it here would be this file guessing at another
    # package's requirements.
    #
    # THE PIN BELOW STILL HARD-REQUIRES cupy-cuda12x, so `pip install ".[decon]"` fails on macOS
    # and on any machine without CUDA 12 (measured 2026-08-05, the resolver error is
    #     ERROR: Could not find a version that satisfies the requirement cupy-cuda12x (from petakit)
    # and pip resolves a whole command atomically, so `.[stitch,decon]` loses tilefusion too).
    # petakit commit 97b06b0 (branch cupy-optional, 2026-08-25) moves cupy into its own
    # `petakit[cuda12]` extra; bump this SHA to it once that branch is pushed, an unpushed SHA is
    # a 404 tarball and would break every install. The CUDA payload then rides `decon-cuda`.
    "petakit @ https://github.com/maragall/deconvolution/archive/64de19bca7133e9107d182ba4aff10e2ca856888.tar.gz",
    # torch is the Apple GPU backend (squidxplorer/_decon_gpu.py runs the RL update on MPS). It
    # was declared NOWHERE until 2026-08-25 and worked in the dev env by accident, so a customer
    # Mac always ran petakit's CPU path (measured: 3 min 05 s for 3 iterations on a
    # (46, 2304, 2304) volume whose planes ran torch/mps in 0.3 to 1.5 s).
    #
    # APPLE SILICON ONLY, by marker, on purpose: _decon_gpu never runs on a CPU torch device,
    # NVIDIA machines are petakit's CuPy path (the `decon-cuda` extra below, and _decon_gpu
    # stands down when CuPy sees a device), the PyPI Linux wheel drags the whole CUDA runtime
    # (nvidia-* wheels, gigabytes) and the PyPI Windows wheel is CPU-only, so on those platforms
    # torch would be weight that changes no pixel. CUDA torch wheels are index-specific
    # (download.pytorch.org) and are NOT what any extra here installs. Verified with torch 2.13;
    # the floor is where torch.mps.recommended_max_memory exists (the budget falls back to
    # system RAM without it).
    "torch>=2.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# The CUDA payload for the decon pack, added by the installer ONLY when its probe sees an NVIDIA
# driver speaking CUDA 12 (scripts/installer/bootstrap.py::gpu_backend). cupy-cuda12x is what
# petakit's own `cuda12` extra names; spelled here directly so the petakit SHA lives on ONE line.
decon-cuda = ["squidxplorer[decon]", "cupy-cuda12x"]
# (The `segment` extra — cellpose, for the shelved spot/cellpose operators — was deleted
# 2026-08-24. The declaration test enforces extra <-> group both ways, so the group and the
# operators leave together. Git history reinstates.)

[project.scripts]
squidxplorer = "squidxplorer._cli:main"           # headless CLI (IMA-186): MIP a plate from the terminal
squidxplorer-view = "squidxplorer._viewer:main"   # the MIP tool desktop app

[tool.hatch.metadata]
# Every [gui] dependency is still a plain PyPI release -- that part of the note this replaces
# was correct, and `pip install .[gui]` needs no exemption.
#
# RESTORED 2026-08-05 for the operator extras, NOT for ndviewer_light (that git+ URL is gone for
# good; it imported PyQt5 at module scope). `stitch` and `decon` name tilefusion and petakit by
# git URL because neither has a PyPI release, and hatchling refuses a direct reference in ANY
# dependency table -- optional-dependencies included -- unless this is true.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["squidxplorer"]

[tool.pytest.ini_options]
# THIS repo's suite is tests/. Stated explicitly as of 2026-08-05, because it stopped being the
# only answer: `templates/operator/` is a standalone example PACKAGE with its own pyproject and
# its own tests, and those tests import `squidxplorer_operator_template`, which is only importable
# when a contributor has installed the template. Collected from the repo root they are an import
# error in a suite that has nothing to do with them. Run them where they belong:
#     pip install -e templates/operator && pytest templates/operator/tests
testpaths = ["tests"]
markers = [
    "integration: requires the real hongquan dataset on disk (deselect with -m 'not integration')",
    "agave: talks to a REAL AGAVE server; skips with a named reason when AGAVE is not installed",
]
